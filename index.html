<!-- Native ES modules: no npm, no bundler, no transpiler. Served fine by GitHub Pages and by
     `python -m http.server`, but they DO NOT work over file:// - open the preview URL, never the
     file directly.

     The import map is what makes a deploy actually take effect. Putting ?v= only on app.js below
     versioned ONE file: every `import "./ui.js"` inside it resolved to an unversioned URL and came
     straight back out of the browser cache, so a redeploy served new HTML around old modules and
     the app half-updated. Mapping each module to a versioned URL here means bumping the version in
     this file (and BUILD in js/config.js, which is only the label in the footer) re-fetches all of
     them. Keep this list in step with the contents of js/.

     The ?v= on the <script> tag below is NOT redundant with the map. An import map only governs
     module SPECIFIER resolution - import statements and import() - so a script element's src is
     parsed as an ordinary URL and never consulted against it. Drop the query there and app.js
     becomes the one file the map cannot reach: it would come back from cache on the next deploy
     while everything it imports updated around it. -->
<script type="importmap">
{
  "imports": {
    "./js/api.js": "./js/api.js?v=2026-08-14.2",
    "./js/app.js": "./js/app.js?v=2026-08-14.2",
    "./js/auth.js": "./js/auth.js?v=2026-08-14.2",
